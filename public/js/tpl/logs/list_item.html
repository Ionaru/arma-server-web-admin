<td>
    <% if (size < 100 * 1024 * 1024) { %>
    <!-- Only show files under 100 MB -->
    <a href='/api/logs/<%-encodedId%>/view' target=_blank><%-name%></a>
    <% } else { %>
    <%-name%>
    <% } %>
</td>
<td style="white-space: nowrap;">
    <%-serverTitles%>
    <% if (roleLabel) { %>
    <span class="badge <%-roleClass%>"><%-roleLabel%></span>
    <% } %>
</td>
<td style="text-align: right; white-space: nowrap;">
    <%-formattedSize%>
</td>
<td>
    <a class="btn btn-primary btn-sm text-nowrap" href="/api/logs/<%-encodedId%>/download">
        <i class="bi bi-download" aria-hidden="true"></i>
        Download
    </a>
</td>
<td>
    <a class="btn btn-danger btn-sm text-nowrap destroy ladda-button float-end" data-style="expand-left">
        <i class="bi bi-trash-fill" aria-hidden="true"></i>
        Delete
    </a>
</td>
