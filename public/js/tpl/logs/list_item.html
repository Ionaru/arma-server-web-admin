<td>
    <% if (size < 100 * 1024 * 1024) { %>
    <!-- Only show files under 100 MB -->
    <a href='/api/logs/<%-encodedId%>/view' target=_blank><%-name%></a>
    <% } else { %>
    <%-name%>
    <% } %>
</td>
<td style="white-space: nowrap;">
    <%-serverTitles%>
    <% if (roleLabel) { %>
    <span class="label <%-roleClass%>"><%-roleLabel%></span>
    <% } %>
</td>
<td style="text-align: right; white-space: nowrap;">
    <%-formattedSize%>
</td>
<td>
    <a class="btn btn-primary btn-xs" href="/api/logs/<%-encodedId%>/download">
        <span class="glyphicon glyphicon-download"></span>
        Download
    </a>
</td>
<td>
    <a class="btn btn-danger btn-xs destroy ladda-button pull-right" data-style="expand-left">
        <span class="glyphicon glyphicon-trash"></span>
        Delete
    </a>
</td>
