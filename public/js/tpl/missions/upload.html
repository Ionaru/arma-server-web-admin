<form role="form" enctype="multipart/form-data">
    <div class="mb-3">
        <label for="missions" class="form-label">Mission Files</label>
        <input multiple="multiple"
               accept=".pbo"
               type="file"
               class="form-control path"
               name="missions"
               id="missions"
        >
        <div class="form-text">Only supports missions packed as a PBO</div>
    </div>
    <button type="submit" class="btn btn-primary ladda-button" data-style="expand-left">
        <i class="bi bi-cloud-upload-fill" aria-hidden="true"></i>
        Upload
    </button>
</form>
