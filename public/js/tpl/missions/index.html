<div class="row">
    <div class="col-sm-4 order-sm-2">
        <div class="card mb-3">
            <div class="card-header">
                <h3 class="card-title h6 mb-0">Upload Mission</h3>
            </div>
            <div class="card-body" id="upload"></div>
        </div>

        <div class="card mb-3">
            <div class="card-header">
                <h3 class="card-title h6 mb-0">Refresh missions list</h3>
            </div>
            <div class="card-body">
                <p>
                    A refresh is needed if a mission is added manually to the missions directory on the server.
                    Uploads through this manager update the list automatically.
                </p>

                <a class="btn btn-primary" id="refresh" href="#">
                    <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                    Refresh
                </a>
            </div>
        </div>
    </div>
    <div class="col-sm-8 order-sm-1">
        <form>
            <div class="mb-3">
                <label for="filterMissions" class="form-label">Filter</label>
                <input type="text" class="form-control" id="filterMissions" placeholder="Filter missions..."
                       value="<%-filterValue%>">
            </div>
        </form>

        <div id="list"></div>
    </div>
</div>
