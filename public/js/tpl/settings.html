<form role="form">
    <div class="row mb-3">
        <label for="path" class="col-sm-2 col-form-label">Path</label>
        <div class="col-sm-10">
            <input type="text" class="form-control" placeholder="Path to ArmA" disabled value="<%- path %>">
        </div>
    </div>

    <div class="row mb-3">
        <label for="type" class="col-sm-2 col-form-label pt-0">Type</label>
        <div class="col-sm-10">
            <div class="form-check">
                <label class="form-check-label">
                    <input type="radio" class="form-check-input" name="type" value="linux" disabled <%- isTypeChecked('linux') %>>
                    Linux
                </label>
            </div>
            <div class="form-check">
                <label class="form-check-label">
                    <input type="radio" class="form-check-input" name="type" value="windows" disabled <%- isTypeChecked('windows') %>>
                    Windows
                </label>
            </div>
            <div class="form-check">
                <label class="form-check-label">
                    <input type="radio" class="form-check-input" name="type" value="wine" disabled <%- isTypeChecked('wine') %>>
                    Wine
                </label>
            </div>
        </div>
    </div>
</form>
