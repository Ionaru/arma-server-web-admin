name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tests require app.js, which needs a config.js whose path exists.
      - name: Create config.js
        run: |
          mkdir -p "$RUNNER_TEMP/arma"
          sed "s#path-to-arma3-directory#$RUNNER_TEMP/arma#" config.js.example > config.js
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run check-bundle
